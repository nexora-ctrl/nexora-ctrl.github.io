
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA — Endless Possibilities</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d1b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 700px; }
    .logo {
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 900;
      letter-spacing: 10px;
      background: linear-gradient(90deg, #36bafa, #8175ff);
      background-clip: text;
      color: transparent;
    }
    p {
      color: #aab6d0;
      line-height: 1.8;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      border-radius: 9px;
      color: white;
      background: #315fe9;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">NEXORA</div>
    <h2>One Name. Endless Possibilities.</h2>
    <p>
      A creative space for ideas, applications,
      software, tools, experiments, and everything
      worth building.
    </p>
    <a href="https://github.com/nexora-ctrl">
      Explore My GitHub
    </a>
    <p>© 2026 NEXORA. Built with creativity.</p>
  </main>
</body>
</html>
